# Regions the pipeline can process. A new region = a new [[region]] block (PRINCIPLES #4).
#
# bbox = [west, south, east, north] in degrees (lon/lat, EPSG:4326), the order STAC APIs expect.
# The legacy export experiment converts it to [[south, west], [north, east]].
# zoom is retained for that experimental manifest; the live globe does not use this file.

[[region]]
id = "okc-norman"
name = "Oklahoma City & Norman, OK"
bbox = [-97.86, 35.13, -97.20, 35.74]
zoom = 10

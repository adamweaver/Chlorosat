# nginx site config for Chlorosat. OWNER: Adam only (VPS owner). See docs/DEPLOYMENT.md.
# This is a copy of the live file on the VPS (/etc/nginx/sites-available/chlorosat.com; linked from sites-enabled/).
# It sits BESIDE the personal-site config on the same VPS; it never replaces it.
#
# ⚠ PUBLIC REPO: never add IP addresses here (e.g. `listen <ip>:443`, IPs in server_name,
#   allow/deny lines). See docs/DEPLOYMENT.md#security.
#
# Changing it (Adam, on the VPS):
#   1. Back up:  sudo cp /etc/nginx/sites-available/chlorosat.com ~/chlorosat.nginx.bak
#   2. Edit the live file, then: sudo nginx -t  (check syntax; protects the personal site)
#   3. Only if the test passes: sudo systemctl reload nginx
#   4. Copy the change back into this file and commit it.
#
# Notes:
#   - www -> chlorosat.com is a Cloudflare Redirect Rule, so www normally never reaches the VPS.
#     www is listed below only as a fallback if the rule is removed.
#   - HTTPS: the "managed by Certbot" lines were added by `sudo certbot --nginx`. Leave them alone;
#     certbot renews the certificate automatically.
#   - gzip is not set here: Cloudflare already compresses responses for visitors.

# HTTPS: serves the site.
server {
    server_name chlorosat.com www.chlorosat.com;
    root /var/www/chlorosat.com;
    index index.html;

    # Serve the file, or the folder's index.html (/about/ -> about/index.html), else 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Use the site's own 404 page (web/out/404.html) instead of nginx's default one.
    error_page 404 /404.html;

    # Build files: names change on every build, so browsers + Cloudflare may keep them for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Map images + stats: they change when the pipeline re-runs, so keep them for 1 hour only.
    location /data/ {
        add_header Cache-Control "public, max-age=3600";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chlorosat.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chlorosat.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP (port 80): send everyone to HTTPS. Written by certbot; leave as is.
server {
    if ($host = www.chlorosat.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = chlorosat.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name chlorosat.com www.chlorosat.com;
    return 404; # managed by Certbot
}

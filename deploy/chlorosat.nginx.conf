# nginx site config for Chlorosat. OWNER: Adam only (VPS owner). See docs/DEPLOYMENT.md.
# It sits BESIDE the personal-site config on the same VPS; it never replaces it.
#
# Install (Adam):
#   Debian/Ubuntu: copy to /etc/nginx/sites-available/chlorosat, symlink into sites-enabled/
#   Other distros: copy to /etc/nginx/conf.d/chlorosat.conf
#   Then: sudo nginx -t  (check syntax; protects the personal site)  ->  sudo systemctl reload nginx
#   HTTPS: sudo certbot --nginx -d <domain>  (adds the certificate lines + auto-renewal + redirect)
#
# TODO(CS-013, S2, Adam):
#   1. server_name = the real (sub)domain (DNS A record must point to the VPS first)
#   2. root /var/www/chlorosat;  index index.html;
#   3. location / { try_files $uri $uri/ =404; }   (static export: /about/ -> about/index.html)
#   4. error_page 404 /404.html;
#   5. gzip for html/css/js/json (check whether the main nginx.conf already turns it on)
# TODO(CS-027, S3, Adam):
#   6. Cache headers: long (e.g. 1 year, immutable) for /_next/static/ (file names change each
#      build); short (e.g. 1 hour) for /data/ (changes when the pipeline re-runs)

server {
    listen 80;
    server_name chlorosat.example.com;  # TODO: real domain
    # directives go here
}

# Deploy: every push to main (= every merged PR) builds the site and uploads it to the VPS.
# Also has a "Run workflow" button (Actions tab -> Deploy) to redeploy by hand, e.g. after a rollback.
#
# How it works: GitHub runs deploy/deploy.sh (the same script Adam uses by hand), which builds
# web/out/ and rsyncs it over SSH as `chlorosat-deploy`. That key is locked on the server (rrsync)
# to "write files into /var/www/chlorosat.com, nothing else".
#
# Secrets (VPS_HOST, VPS_SSH_KEY, VPS_KNOWN_HOSTS) live in the GitHub `production` environment,
# which only `main` can use, so workflows from PRs can't read them. Only Adam manages them.
# Logs are PUBLIC: never echo a secret, never add -v to ssh/rsync. Rules: docs/DEPLOYMENT.md#security
#
# [AI] Written: 2026-09-24 · Claude Opus 5.5 · requested by Adam Weaver (CS-024)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the job only needs to read the code.
permissions:
  contents: read

# Two quick merges never upload at the same time; the second waits for the first.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # unlocks the secrets (main only)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm # reuse downloaded packages between runs
          cache-dependency-path: web/package-lock.json

      # Write the private key and the server's host key to files for ssh.
      # Secrets come in through env: (not pasted into the script), and nothing is printed.
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh checks the server against this list, so it refuses an impostor.
          # (Never use StrictHostKeyChecking=no.)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Build + upload. deploy.sh stops if the build fails or web/out/index.html is missing,
      # so --delete can never wipe the live site with an empty folder.
      - name: Build and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: DEPLOY_TARGET="chlorosat-deploy@${VPS_HOST}:" DEPLOY_SSH_KEY="$HOME/.ssh/deploy_key" ./deploy/deploy.sh

      # Delete the key even if a step above failed (the runner is thrown away anyway).
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chlorosat</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
@font-face {
  font-family: "Outfit";
  font-weight: 100 900;
  font-display: swap;
  src: url("outfit.woff2") format("woff2");
}
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}
body {
  background-color: #2a2a2a;
  color: #a8e0be;
  font-family: "Outfit", "DejaVu Sans", Verdana, sans-serif;
  overflow: hidden;
}
#stars {
  position: fixed;
  inset: 0;
  z-index: -1;
}
#stars span {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background-color: #a8e0be;
  opacity: 0.15;
  animation: twinkle 4s ease-in-out infinite;
}
#stack {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(90vw, 560px);
  text-align: center;
}
#name {
  font-size: min(15vw, 84px);
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1;
  color: #2e9e63;
  margin: 0;
  user-select: none;
}
#sat {
  display: block;
  width: min(60vw, 42vh, 300px);
  height: auto;
  margin: 4vh auto 3vh;
  animation: drift 7s ease-in-out infinite;
}
#leaf {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: sway 3.5s ease-in-out infinite;
}
.arc {
  animation: beam 2.4s ease-in-out infinite;
}
#arc2 { animation-delay: 0.3s; }
#arc3 { animation-delay: 0.6s; }
#status {
  font-size: 13px;
  letter-spacing: 0.25em;
  /* Balance the trailing letter-spacing after the last letter */
  padding-left: 0.25em;
  text-transform: uppercase;
  color: #56c27f;
  margin: 0;
}
@keyframes drift {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(-10px) rotate(2deg); }
}
@keyframes sway {
  0%, 100% { transform: rotate(-6deg); }
  50%      { transform: rotate(6deg); }
}
@keyframes beam {
  0%, 100% { opacity: 0.15; }
  30%      { opacity: 1; }
}
@keyframes twinkle {
  0%, 100% { opacity: 0.1; }
  50%      { opacity: 0.6; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}
</style>
</head>
<body>

<div id="stars"></div>

<div id="stack">

<h1 id="name">Chlorosat</h1>

<svg id="sat" viewBox="0 0 175 175" role="img" aria-label="Chlorosat satellite">
  <g transform="rotate(-28,-30.141239,121.20777)">
    <g transform="matrix(0.94,0,0,0.94,6,6)">
      <rect x="3.4831829" y="124.01196" width="58" height="34" rx="5" fill="#2e9e63"/>
      <rect x="125.48318" y="124.01196" width="58" height="34" rx="5" fill="#2e9e63"/>
      <g stroke="#a8e0be" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.85" transform="translate(-6.516817,28.01196)">
        <path d="M 16,113 H 62"/>
        <path d="M 56,113 44,102 m 0,11 -12,-11 m 0,11 -12,-11"/>
        <path d="m 56,113 -12,11 m 0,-11 -12,11 m 0,-11 -12,11"/>
        <path d="m 138,113 h 46"/>
        <path d="m 144,113 12,-11 m 0,11 12,-11 m 0,11 12,-11"/>
        <path d="m 144,113 12,11 m 0,-11 12,11 m 0,-11 12,11"/>
      </g>
      <rect x="57.483181" y="136.01196" width="12" height="10" fill="#15503a"/>
      <rect x="117.48318" y="136.01196" width="12" height="10" fill="#15503a"/>
      <path d="m 115.11344,176.75725 a 22.000001,16.000001 0 0 0 -43.999997,0 z" fill="#56c27f"/>
      <rect x="67.483185" y="116.01196" width="52" height="48" rx="12" fill="#15503a"/>
      <rect x="81.483185" y="130.01196" width="24" height="20" rx="5" fill="#2e9e63" opacity="0.9"/>
      <path d="m 93.483183,116.01196 v -14" stroke="#15503a" stroke-width="7" stroke-linecap="round"/>
      <path id="leaf" d="m 93.630079,105.52242 c -9.002568,-6.996675 -9.006975,-18.996679 -0.0095,-25.999975 9.002531,6.996709 9.006951,18.996693 0.0095,25.999975 z" fill="#56c27f"/>
      <g fill="none" stroke="#2e9e63" stroke-width="7" stroke-linecap="round" transform="translate(-5.5957707,23.895324)">
        <path id="arc1" class="arc" d="m 117.9,162.5 a 32,32 0 0 1 -35.8,0"/>
        <path id="arc2" class="arc" d="m 124,171.6 a 43,43 0 0 1 -48,0"/>
        <path id="arc3" class="arc" d="m 130.2,180.8 a 54,54 0 0 1 -60.4,0"/>
      </g>
    </g>
  </g>
</svg>

<p id="status">Work in progress</p>

</div>

<script>
var stars = document.getElementById("stars");
for (var i = 0; i < 90; i++) {
  var s = document.createElement("span");
  s.style.left = (Math.random() * 100) + "%";
  s.style.top = (Math.random() * 100) + "%";
  s.style.animationDelay = (Math.random() * 4) + "s";
  s.style.animationDuration = (3 + Math.random() * 4) + "s";
  stars.appendChild(s);
}
</script>

</body>
</html>
